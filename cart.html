<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your Order | Abir Restaurant</title><style>:root{ --ink:#211a16; --muted:#756b63; --cream:#f7f3ed; --surface:#fff; --surface-soft:#fbf8f4; --line:#e8e0d7; --accent:#9a5b22; --success:#1f7a3d; --success-dark:#17632f; --danger:#a52323; --shadow:0 18px 45px rgba(45,33,24,.10); --radius:18px;}*{ box-sizing:border-box; margin:0; padding:0;}html{ scroll-behavior:smooth;}body{ min-height:100vh; display:flex; flex-direction:column; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5; background:var(--cream); color:var(--ink);}button,input,textarea{ font:inherit;}button,a,label{ -webkit-tap-highlight-color:transparent;}header{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:20px clamp(20px,5vw,72px); background:#111; color:#fff;}.logo{ font-size:clamp(18px,2vw,23px); font-weight:800; letter-spacing:.08em; white-space:nowrap;}nav{ display:flex; align-items:center; gap:24px;}nav a{ position:relative; color:#fff; text-decoration:none; font-size:14px; font-weight:600;}nav a:hover,nav a:focus-visible{ color:#f0c18f;}.hero{ padding:clamp(58px,8vw,92px) 20px; background: linear-gradient(135deg,rgba(45,33,24,.96),rgba(45,33,24,.82)), radial-gradient(circle at top right,#9a5b22,transparent 45%); color:#fff; text-align:center;}.hero h1{ margin-bottom:12px; font-size:clamp(32px,5vw,52px); line-height:1.1; letter-spacing:-.03em;}.hero p{ max-width:520px; margin:0 auto; color:#e8ded5; font-size:clamp(15px,2vw,18px);}.container{ width:min(100% - 32px,1100px); margin:clamp(28px,5vw,52px) auto;}.cart-box{ overflow:hidden; padding:clamp(20px,4vw,36px); border:1px solid rgba(232,224,215,.9); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}.cart-list{ display:flex; flex-direction:column;}.cart-item{ display:grid; grid-template-columns:110px minmax(0,1fr) auto; align-items:center; gap:20px; padding:20px 0; border-bottom:1px solid var(--line);}.cart-item:first-child{ padding-top:0;}.cart-item:last-child{ border-bottom:0;}.cart-item img{ width:110px; height:90px; display:block; object-fit:cover; border-radius:12px; background:#eee;}.item-info{ min-width:0;}.item-info h3{ margin-bottom:6px; overflow:hidden; font-size:18px; line-height:1.3; text-overflow:ellipsis; white-space:nowrap;}.price{ color:var(--accent); font-size:15px; font-weight:800;}.controls{ display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:nowrap;}.controls button{ width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; border:1px solid transparent; border-radius:9px; background:#111; color:#fff; cursor:pointer; font-size:19px; font-weight:700; transition:background .2s ease,transform .2s ease;}.controls button:hover{ background:#333; transform:translateY(-1px);}.qty{ min-width:28px; color:var(--ink); text-align:center; font-weight:800;}.remove{ width:auto!important; padding:0 12px; background:var(--danger)!important; font-size:13px!important;}.remove:hover{ background:#861c1c!important;}.total{ display:flex; align-items:center; justify-content:flex-end; gap:8px; margin:28px 0 0; padding-top:24px; border-top:1px solid var(--line); color:var(--ink); font-size:clamp(21px,3vw,28px); font-weight:800;}.form-section{ margin-top:34px; padding-top:30px; border-top:1px solid var(--line);}.form-section h2{ margin-bottom:20px; font-size:clamp(22px,3vw,28px); letter-spacing:-.02em;}.form-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}.form-grid input{ margin-bottom:0;}input,textarea{ width:100%; padding:14px 16px; border:1px solid #d9d0c7; border-radius:10px; outline:none; background:#fff; color:var(--ink); font-size:16px;}input::placeholder,textarea::placeholder{ color:#9a9088;}input:focus,textarea:focus{ border-color:var(--accent); background:#fffdfb; box-shadow:0 0 0 4px rgba(154,91,34,.13);}textarea{ min-height:112px; margin-top:16px; resize:vertical;}.delivery{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:16px;}.delivery label{ display:flex; align-items:center; gap:10px; padding:13px 15px; border:1px solid var(--line); border-radius:10px; background:var(--surface-soft); color:var(--ink); cursor:pointer; font-weight:700;}.delivery label:has(input:checked){ border-color:var(--accent); background:#fff8f0; box-shadow:0 0 0 3px rgba(154,91,34,.10);}.delivery input{ width:17px; height:17px; margin:0; accent-color:var(--accent);}.checkout{ width:100%; min-height:54px; margin-top:16px; padding:15px 20px; border:0; border-radius:10px; background:var(--success); color:#fff; cursor:pointer; font-size:17px; font-weight:800; transition:background .2s ease,box-shadow .2s ease,transform .2s ease;}.checkout:hover{ background:var(--success-dark); box-shadow:0 8px 18px rgba(31,122,61,.2); transform:translateY(-1px);}.empty{ padding:clamp(34px,7vw,64px) 10px; text-align:center;}.empty h2{ margin-bottom:8px; font-size:clamp(23px,4vw,30px);}.empty p{ color:var(--muted);}.empty a{ display:inline-flex; align-items:center; justify-content:center; min-height:46px; margin-top:22px; padding:12px 20px; border-radius:9px; background:#111; color:#fff; text-decoration:none; font-weight:700;}footer{ margin-top:auto; padding:28px 20px; background:#111; color:#aaa; text-align:center; font-size:14px;}@media(max-width:760px){ header{ align-items:flex-start; flex-direction:column; gap:16px; } nav{ width:100%; justify-content:space-between; gap:14px; } .cart-item{ grid-template-columns:88px minmax(0,1fr); gap:14px; } .cart-item img{ width:88px; height:76px; } .controls{ grid-column:1 / -1; justify-content:flex-start; } .form-grid{ grid-template-columns:1fr; gap:16px; }}@media(max-width:480px){ .container{ width:min(100% - 20px,1100px); } .cart-box{ padding:18px 16px; border-radius:14px; } .hero{ padding:52px 16px; } nav{ justify-content:flex-start; gap:18px; } nav a{ font-size:13px; } .delivery{ grid-template-columns:1fr; } .total{ justify-content:space-between; margin-top:22px; } .controls{ gap:7px; } .controls button{ width:38px; height:38px; } .remove{ flex:1; min-width:92px; }}</style></head><body><header><div class="logo">ABIR RESTAURANT</div><nav><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="order.html">Order</a></nav></header><section class="hero"><h1>Your Order</h1><p>Review your items and place your order.</p></section><main class="container"><section class="cart-box"><div id="cartItems" class="cart-list"></div><div id="orderForm" style="display:none;"><div class="total"><span>Total:</span><span>₦<span id="total">0</span></span></div><div class="form-section"><h2>Customer Details</h2><div class="form-grid"><input id="customerName" type="text" placeholder="Full Name"><input id="phone" type="tel" placeholder="Phone Number"></div><div class="delivery"><label><input type="radio" name="delivery" value="Delivery" checked><span>Delivery</span></label><label><input type="radio" name="delivery" value="Pickup"><span>Pickup</span></label></div><input id="address" type="text" placeholder="Delivery Address"><textarea id="note" placeholder="Additional note (optional)"></textarea><button class="checkout" onclick="checkout()">Order via WhatsApp</button></div></div></section></main><footer>© 2026 Abir Restaurant. All rights reserved.</footer><script>const whatsappNumber = "2349066324358";const foodImages = {"Jollof Rice & Chicken":"https://images.unsplash.com/photo-1604329760661-e71dc83f8f26?auto=format&fit=crop&w=800&q=80","Fried Rice & Chicken":"https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=800&q=80","Ofada Rice & Ayamase":"https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=800&q=80","Beans & Plantain":"https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=800&q=80","Yam Porridge":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","Amala & Ewedu":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","Pounded Yam & Egusi":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","Eba & Egusi":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","Semo & Vegetable Soup":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","Grilled Chicken":"https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=800&q=80","Beef Suya":"https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80","Grilled Fish":"https://images.unsplash.com/photo-1544943910-4c1dc44aab44?auto=format&fit=crop&w=800&q=80","Asun":"https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=800&q=80","Beef Burger":"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80","Chicken & Chips":"https://images.unsplash.com/photo-1562967916-eb82221dfb92?auto=format&fit=crop&w=800&q=80","Puff Puff":"https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=800&q=80","Samosa":"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80","Spring Rolls":"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80","Gizdodo":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","Chapman":"https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=800&q=80","Zobo":"https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=800&q=80","Fresh Pineapple Juice":"https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=800&q=80","Watermelon Juice":"https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=800&q=80","Mojito":"https://images.unsplash.com/photo-1551538827-9c037cb4f32a?auto=format&fit=crop&w=800&q=80","Strawberry Mojito":"https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=800&q=80","Pina Colada":"https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=800&q=80","Passion Fruit Cocktail":"https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=800&q=80","Fried Plantain":"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80","French Fries":"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=800&q=80","Coleslaw":"https://images.unsplash.com/photo-1546793665-c74683f339c1?auto=format&fit=crop&w=800&q=80","Moi Moi":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80"};function getCart(){ const saved = localStorage.getItem("comfortCart"); if(!saved){ return []; } try{ const cart = JSON.parse(saved); return Array.isArray(cart) ? cart : []; }catch(error){ return []; }}function saveCart(cart){ localStorage.setItem("comfortCart",JSON.stringify(cart));}function formatMoney(amount){ return Number(amount).toLocaleString("en-NG");}function renderCart(){ const cart = getCart(); const container = document.getElementById("cartItems"); const form = document.getElementById("orderForm"); if(cart.length === 0){ container.innerHTML = ` <div class="empty"> <h2>Your cart is empty</h2> <p>Add some delicious meals before checking out.</p> <a href="order.html">Browse Menu</a> </div> `; form.style.display = "none"; return; } form.style.display = "block"; container.innerHTML = ""; let total = 0; cart.forEach((item,index)=>{ const price = Number(item.price) || 0; const quantity = Number(item.quantity) || 1; total += price * quantity; const image = foodImages[item.name] || ""; const div = document.createElement("article"); div.className = "cart-item"; div.innerHTML = ` <img src="${image}" alt="${item.name}"> <div class="item-info"> <h3>${item.name}</h3> <div class="price">₦${formatMoney(price)}</div> </div> <div class="controls"> <button type="button" aria-label="Decrease quantity" onclick="changeQuantity(${index},-1)">−</button> <span class="qty">${quantity}</span> <button type="button" aria-label="Increase quantity" onclick="changeQuantity(${index},1)">+</button> <button type="button" class="remove" onclick="removeItem(${index})">Remove</button> </div> `; container.appendChild(div); }); document.getElementById("total").textContent = formatMoney(total);}function changeQuantity(index,change){ const cart = getCart(); if(!cart[index]){ return; } cart[index].quantity = (Number(cart[index].quantity) || 1) + change; if(cart[index].quantity <= 0){ cart.splice(index,1); } saveCart(cart); renderCart();}function removeItem(index){ const cart = getCart(); cart.splice(index,1); saveCart(cart); renderCart();}function checkout(){ const cart = getCart(); if(cart.length === 0){ alert("Your cart is empty."); return; } const name = document.getElementById("customerName").value.trim(); const phone = document.getElementById("phone").value.trim(); const address = document.getElementById("address").value.trim(); const note = document.getElementById("note").value.trim(); const delivery = document.querySelector('input[name="delivery"]:checked').value; if(!name){ alert("Please enter your name."); return; } if(!phone){ alert("Please enter your phone number."); return; } if(delivery === "Delivery" && !address){ alert("Please enter your delivery address."); return; } let total = 0; let message = "Hello Abir Restaurant,\n\nI would like to place an order:\n\n"; cart.forEach(item=>{ const subtotal = Number(item.price) * Number(item.quantity); total += subtotal; message += `• ${item.name} x${item.quantity} - ₦${formatMoney(subtotal)}\n`; }); message += `\nTotal: ₦${formatMoney(total)}`; message += `\n\nCustomer: ${name}`; message += `\nPhone: ${phone}`; message += `\nOrder Type: ${delivery}`; if(address){ message += `\nAddress: ${address}`; } if(note){ message += `\nNote: ${note}`; } const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`; window.open(url,"_blank");}renderCart();</script></body></html>
