<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | Abir Restaurant</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
}

nav {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.hero {
    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
    color: white;
    text-align: center;
    padding: 70px 20px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 17px;
}

.container {
    width: 90%;
    max-width: 950px;
    margin: 40px auto;
}

.cart-box,
.checkout-box {
    background: white;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.cart-box h2,
.checkout-box h2 {
    margin-bottom: 20px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 0;
    border-bottom: 1px solid #eee;
}

.cart-item:last-child {
    border-bottom: none;
}

.item-image {
    width: 95px;
    height: 95px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
}

.item-info {
    flex: 1;
}

.item-info h3 {
    margin-bottom: 7px;
    font-size: 18px;
}

.item-price {
    color: #666;
    font-size: 14px;
    margin-bottom: 4px;
}

.quantity-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.quantity-controls button {
    border: none;
    background: #111;
    color: white;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
}

.quantity-controls .remove {
    width: auto;
    padding: 0 12px;
    font-size: 13px;
    background: #c62828;
}

.quantity {
    min-width: 25px;
    text-align: center;
    font-weight: bold;
}

.total {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
    padding-top: 20px;
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #666;
}

.empty a {
    display: inline-block;
    margin-top: 10px;
    background: #111;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.order-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 8px;
    background: #25D366;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.continue {
    display: inline-block;
    margin-top: 10px;
    color: #111;
    text-decoration: none;
    font-weight: bold;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 50px;
}

@media (max-width: 650px) {
    header {
        flex-direction: column;
        text-align: center;
    }

    nav {
        justify-content: center;
    }

    .hero h1 {
        font-size: 32px;
    }

    .cart-item {
        align-items: flex-start;
    }

    .item-image {
        width: 75px;
        height: 75px;
    }

    .quantity-controls {
        justify-content: flex-start;
    }

    .total {
        text-align: left;
    }
}
</style>
</head>
<body>
<header>
    <div class="logo">ABIR RESTAURANT</div>
<nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="order.html">Order From Home</a>
</nav>
</header>
<section class="hero">
    <h1>Your Cart</h1>
    <p>Review your order before checkout.</p>
</section>
<div class="container">
<div class="cart-box">
    <h2>Your Items</h2>

    <div id="cartItems"></div>

    <div class="total">
        Total: ₦<span id="cartTotal">0</span>
    </div>

    <a href="order.html" class="continue">← Continue Shopping</a>
</div>

<div class="checkout-box">
    <h2>Customer Details</h2>

    <div class="form-group">
        <label for="customerName">Full Name</label>
        <input type="text" id="customerName" placeholder="Enter your name">
    </div>

    <div class="form-group">
        <label for="customerPhone">Phone Number</label>
        <input type="tel" id="customerPhone" placeholder="Enter your phone number">
    </div>

    <div class="form-group">
        <label for="orderType">Order Type</label>

        <select id="orderType">
            <option value="Delivery">Delivery</option>
            <option value="Pickup">Pickup</option>
        </select>
    </div>

    <div class="form-group" id="addressGroup">
        <label for="customerAddress">Delivery Address</label>
        <textarea id="customerAddress" placeholder="Enter your delivery address"></textarea>
    </div>

    <div class="form-group">
        <label for="orderNote">Additional Note</label>
        <textarea id="orderNote" placeholder="Any special request?"></textarea>
    </div>

    <button class="order-button" onclick="orderOnWhatsApp()">
        Order on WhatsApp
    </button>
</div>
</div>
<footer>
    © 2026 Abir Restaurant. All rights reserved.
</footer>
<script>

const foodImages = {

    "Jollof Rice & Chicken":
    "https://images.unsplash.com/photo-1604329760661-e71dc83f8f26?auto=format&fit=crop&w=900&q=80",

    "Fried Rice & Chicken":
    "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=900&q=80",

    "Ofada Rice & Ayamase":
    "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=900&q=80",

    "Beans & Plantain":
    "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80",

    "Yam Porridge":
    "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=900&q=80",

    "Amala & Ewedu":
    "https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=900&q=80",

    "Pounded Yam & Egusi":
    "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=80",

    "Eba & Egusi":
    "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80",

    "Semo & Vegetable Soup":
    "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=900&q=80",

    "Grilled Chicken":
    "https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=80",

    "Beef Suya":
    "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=80",

    "Grilled Fish":
    "https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=900&q=80",

    "Asun":
    "https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=900&q=80",

    "Beef Burger":
    "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=80",

    "Chicken & Chips":
    "https://images.unsplash.com/photo-1562967916-eb82221dfb36?auto=format&fit=crop&w=900&q=80",

    "Puff Puff":
    "https://images.unsplash.com/photo-1626804475297-41608ea09aeb?auto=format&fit=crop&w=900&q=80",

    "Samosa":
    "https://images.unsplash.com/photo-1626804475297-41608ea09aeb?auto=format&fit=crop&w=900&q=80",

    "Spring Rolls":
    "https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&w=900&q=80",

    "Gizdodo":
    "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=900&q=80",

    "Chapman":
    "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=900&q=80",

    "Zobo":
    "https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=900&q=80",

    "Fresh Pineapple Juice":
    "https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=900&q=80",

    "Watermelon Juice":
    "https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=900&q=80",

    "Mojito":
    "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=900&q=80",

    "Strawberry Mojito":
    "https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=900&q=80",

    "Pina Colada":
    "https://images.unsplash.com/photo-1572116469696-31de0f17cc34?auto=format&fit=crop&w=900&q=80",

    "Passion Fruit Cocktail":
    "https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=900&q=80",

    "Fried Plantain":
    "https://images.unsplash.com/photo-1623238913973-21e45cced554?auto=format&fit=crop&w=900&q=80",

    "French Fries":
    "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=900&q=80",

    "Coleslaw":
    "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=900&q=80",

    "Moi Moi":
    "https://images.unsplash.com/photo-1596797038530-2c107229654b?auto=format&fit=crop&w=900&q=80"
};

function getCart() {

    let savedCart = localStorage.getItem("comfortCart");

    if (!savedCart) {
        return [];
    }

    try {
        return JSON.parse(savedCart);
    } catch (error) {
        return [];
    }
}

function saveCart(cart) {

    localStorage.setItem(
        "comfortCart",
        JSON.stringify(cart)
    );
}

function displayCart() {

    let cart = getCart();

    let container =
        document.getElementById("cartItems");

    let totalElement =
        document.getElementById("cartTotal");

    if (cart.length === 0) {

        container.innerHTML =
            '<div class="empty">' +
            'Your cart is empty.<br><br>' +
            '<a href="order.html">Go to Menu</a>' +
            '</div>';

        totalElement.textContent = "0";

        return;
    }

    let total = 0;

    container.innerHTML = "";

    cart.forEach(function(item, index) {

        let itemTotal =
            item.price * item.quantity;

        total += itemTotal;

        let image =
            foodImages[item.name] ||
            "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80";

        let div =
            document.createElement("div");

        div.className = "cart-item";

        div.innerHTML = `

            <img
                class="item-image"
                src="${image}"
                alt="${item.name}"
            >

            <div class="item-info">

                <h3>${item.name}</h3>

                <div class="item-price">
                    ₦${item.price.toLocaleString()} each
                </div>

                <div class="item-price">
                    Subtotal: ₦${itemTotal.toLocaleString()}
                </div>

            </div>

            <div class="quantity-controls">

                <button
                    onclick="changeQuantity(${index}, -1)">
                    −
                </button>

                <span class="quantity">
                    ${item.quantity}
                </span>

                <button
                    onclick="changeQuantity(${index}, 1)">
                    +
                </button>

                <button
                    class="remove"
                    onclick="removeItem(${index})">
                    Remove
                </button>

            </div>

        `;

        container.appendChild(div);

    });

    totalElement.textContent =
        total.toLocaleString();
}

function changeQuantity(index, change) {

    let cart = getCart();

    if (!cart[index]) {
        return;
    }

    cart[index].quantity += change;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart(cart);

    displayCart();
}

function removeItem(index) {

    let cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    displayCart();
}

document
.getElementById("orderType")
.addEventListener("change", function() {

    let addressGroup =
        document.getElementById("addressGroup");

    if (this.value === "Pickup") {

        addressGroup.style.display = "none";

    } else {

        addressGroup.style.display = "block";

    }

});

function orderOnWhatsApp() {

    let cart = getCart();

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;
    }

    let customerName =
        document
        .getElementById("customerName")
        .value
        .trim();

    let customerPhone =
        document
        .getElementById("customerPhone")
        .value
        .trim();

    let orderType =
        document
        .getElementById("orderType")
        .value;

    let address =
        document
        .getElementById("customerAddress")
        .value
        .trim();

    let note =
        document
        .getElementById("orderNote")
        .value
        .trim();

    if (customerName === "") {

        alert("Please enter your name.");

        return;
    }

    if (customerPhone === "") {

        alert("Please enter your phone number.");

        return;
    }

    if (
        orderType === "Delivery" &&
        address === ""
    ) {

        alert(
            "Please enter your delivery address."
        );

        return;
    }

    let message =
        "Hello Abir Restaurant,\n\n";

    message +=
        "I would like to place an order.\n\n";

    message +=
        "ORDER:\n";

    let total = 0;

    cart.forEach(function(item) {

        let itemTotal =
            item.price * item.quantity;

        total += itemTotal;

        message +=
            item.name +
            " x " +
            item.quantity +
            " - ₦" +
            itemTotal.toLocaleString() +
            "\n";

    });

    message +=
        "\nTOTAL: ₦" +
        total.toLocaleString() +
        "\n\n";

    message +=
        "CUSTOMER DETAILS:\n";

    message +=
        "Name: " +
        customerName +
        "\n";

    message +=
        "Phone: " +
        customerPhone +
        "\n";

    message +=
        "Order Type: " +
        orderType +
        "\n";

    if (orderType === "Delivery") {

        message +=
            "Address: " +
            address +
            "\n";
    }

    if (note !== "") {

        message +=
            "Note: " +
            note +
            "\n";
    }

    message +=
        "\nPlease confirm my order. Thank you.";

    let phoneNumber =
        "2349066324358";

    let whatsappURL =
        "https://wa.me/" +
        phoneNumber +
        "?text=" +
        encodeURIComponent(message);

    window.location.href =
        whatsappURL;
}

displayCart();

</script>
</body>
</html>
