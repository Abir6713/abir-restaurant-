<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Your Cart - Comfort Grills & Bites</title>

<style>

body {
 font-family: Arial, sans-serif;
 margin: 0;
 background: #f8f8f8;
 color: #222;
}

header {
 background: #111;
 color: white;
 padding: 20px;
 text-align: center;
}

header h1 {
 margin: 0;
 font-size: 24px;
}

.container {
 max-width: 900px;
 margin: 30px auto;
 padding: 20px;
}

.cart-box,
.form-box {
 background: white;
 padding: 25px;
 margin-bottom: 25px;
 border-radius: 12px;
 box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
 margin-top: 0;
}

.cart-item {
 display: flex;
 justify-content: space-between;
 align-items: center;
 border-bottom: 1px solid #ddd;
 padding: 15px 0;
 gap: 15px;
}

.item-info {
 flex: 1;
}

.item-name {
 font-weight: bold;
 font-size: 17px;
}

.item-price {
 color: #777;
 margin-top: 5px;
}

.quantity-controls {
 display: flex;
 align-items: center;
 gap: 10px;
}

.quantity-controls button {
 width: 32px;
 height: 32px;
 border: none;
 background: #111;
 color: white;
 border-radius: 5px;
 cursor: pointer;
}

.quantity {
 font-weight: bold;
}

.remove-btn {
 background: #c62828 !important;
}

.total {
 text-align: right;
 font-size: 22px;
 font-weight: bold;
 margin-top: 20px;
}

label {
 display: block;
 font-weight: bold;
 margin-top: 15px;
 margin-bottom: 7px;
}

input,
select,
textarea {
 width: 100%;
 padding: 12px;
 box-sizing: border-box;
 border: 1px solid #ccc;
 border-radius: 6px;
 font-size: 15px;
}

textarea {
 min-height: 100px;
 resize: vertical;
}

.whatsapp-btn {
 width: 100%;
 padding: 15px;
 margin-top: 25px;
 border: none;
 border-radius: 7px;
 background: #25D366;
 color: white;
 font-size: 18px;
 font-weight: bold;
 cursor: pointer;
}

.whatsapp-btn:hover {
 background: #1ebe5d;
}

.continue-btn {
 display: block;
 text-align: center;
 margin-top: 15px;
 padding: 13px;
 background: #111;
 color: white;
 text-decoration: none;
 border-radius: 7px;
}

.empty-cart {
 text-align: center;
 padding: 30px;
 color: #777;
}

.address-box {
 display: none;
}

footer {
 background: #111;
 color: white;
 text-align: center;
 padding: 20px;
 margin-top: 40px;
}

@media (max-width: 600px) {

 .container {
 padding: 10px;
 margin: 15px auto;
 }

 .cart-box,
 .form-box {
 padding: 18px;
 }

 .cart-item {
 flex-wrap: wrap;
 }

 .quantity-controls {
 width: 100%;
 justify-content: flex-end;
 }

}

</style>

</head>

<body>


<header>

<h1>COMFORT GRILLS & BITES</h1>

<p>Your Cart</p>

</header>


<div class="container">


<div class="cart-box">

<h2>Your Order</h2>

<div id="cartItems"></div>

<div class="total">

Total: ₦<span id="cartTotal">0</span>

</div>

</div>



<div class="form-box">

<h2>Customer Details</h2>


<label for="customerName">
Name
</label>

<input
type="text"
id="customerName"
placeholder="Enter your name"
>



<label for="customerPhone">
Phone Number
</label>

<input
type="tel"
id="customerPhone"
placeholder="Enter your phone number"
>



<label for="orderType">
Order Type
</label>

<select
id="orderType"
onchange="toggleAddress()"
>

<option value="Delivery">
Delivery
</option>

<option value="Pickup">
Pickup
</option>

</select>



<div
class="address-box"
id="addressBox"
>

<label for="customerAddress">
Delivery Address
</label>

<textarea
id="customerAddress"
placeholder="Enter your delivery address"
></textarea>

</div>



<label for="orderNote">
Additional Note
</label>

<textarea
id="orderNote"
placeholder="Any special request or instruction?"
></textarea>



<button
class="whatsapp-btn"
onclick="orderOnWhatsApp()"
>

Order on WhatsApp

</button>


<a
href="index.html"
class="continue-btn"
>

Continue Shopping

</a>


</div>


</div>


<footer>

<p>© 2026 Comfort Grills & Bites</p>

</footer>



<script>


function getCart() {

 return JSON.parse(
 localStorage.getItem("comfortCart")
 ) || [];

}



function saveCart(cart) {

 localStorage.setItem(
 "comfortCart",
 JSON.stringify(cart)
 );

}



function formatPrice(price) {

 return Number(price).toLocaleString();

}



function displayCart() {

 let cart = getCart();

 let cartItems =
 document.getElementById("cartItems");

 let cartTotal =
 document.getElementById("cartTotal");


 if (cart.length === 0) {

 cartItems.innerHTML = `
 <div class="empty-cart">
 Your cart is empty.
 </div>
 `;

 cartTotal.textContent = "0";

 return;

 }


 let total = 0;

 cartItems.innerHTML = "";


 cart.forEach(function(item, index) {

 let itemTotal =
 item.price * item.quantity;

 total += itemTotal;


 cartItems.innerHTML += `

 <div class="cart-item">

 <div class="item-info">

 <div class="item-name">
 ${item.name}
 </div>

 <div class="item-price">
 ₦${formatPrice(item.price)}
 </div>

 </div>


 <div class="quantity-controls">

 <button
 onclick="changeQuantity(${index}, -1)"
 >
 -
 </button>

 <span class="quantity">
 ${item.quantity}
 </span>

 <button
 onclick="changeQuantity(${index}, 1)"
 >
 +
 </button>

 <button
 class="remove-btn"
 onclick="removeItem(${index})"
 >
 Remove
 </button>

 </div>

 </div>

 `;

 });


 cartTotal.textContent =
 formatPrice(total);

}



function changeQuantity(index, change) {

 let cart = getCart();

 cart[index].quantity += change;


 if (cart[index].quantity <= 0) {

 cart.splice(index, 1);

 }


 saveCart(cart);

 displayCart();

}



function removeItem(index) {

 let cart = getCart();

 cart.splice(index, 1);

 saveCart(cart);

 displayCart();

}



function toggleAddress() {

 let orderType =
 document.getElementById("orderType").value;

 let addressBox =
 document.getElementById("addressBox");


 if (orderType === "Delivery") {

 addressBox.style.display = "block";

 } else {

 addressBox.style.display = "none";

 }

}



function orderOnWhatsApp() {


 let cart = getCart();


 if (cart.length === 0) {

 alert("Your cart is empty.");

 return;

 }


 let customerName =
 document
 .getElementById("customerName")
 .value
 .trim();


 let customerPhone =
 document
 .getElementById("customerPhone")
 .value
 .trim();


 let orderType =
 document
 .getElementById("orderType")
 .value;


 let address =
 document
 .getElementById("customerAddress")
 .value
 .trim();


 let note =
 document
 .getElementById("orderNote")
 .value
 .trim();


 if (customerName === "") {

 alert("Please enter your name.");

 return;

 }


 if (customerPhone === "") {

 alert("Please enter your phone number.");

 return;

 }


 if (
 orderType === "Delivery" &&
 address === ""
 ) {

 alert("Please enter your delivery address.");

 return;

 }


 let message =
 "Hello Comfort Grills & Bites,\n\n";


 message +=
 "I would like to place an order.\n\n";


 message +=
 "ORDER:\n";


 let total = 0;


 cart.forEach(function(item) {

 let itemTotal =
 item.price * item.quantity;


 total += itemTotal;


 message +=
 item.name +
 " x " +
 item.quantity +
 " - ₦" +
 itemTotal.toLocaleString() +
 "\n";

 });


 message +=
 "\nTOTAL: ₦" +
 total.toLocaleString() +
 "\n\n";


 message +=
 "CUSTOMER DETAILS:\n";


 message +=
 "Name: " +
 customerName +
 "\n";


 message +=
 "Phone: " +
 customerPhone +
 "\n";


 message +=
 "Order Type: " +
 orderType +
 "\n";


 if (orderType === "Delivery") {

 message +=
 "Address: " +
 address +
 "\n";

 }


 if (note !== "") {

 message +=
 "Note: " +
 note +
 "\n";

 }


 message +=
 "\nPlease confirm my order. Thank you.";


 let phoneNumber =
 "2349066324358";


 let whatsappURL =
 "https://wa.me/" +
 phoneNumber +
 "?text=" +
 encodeURIComponent(message);


 window.location.href =
 whatsappURL;

}



displayCart();

toggleAddress();


</script>


</body>

</html>
