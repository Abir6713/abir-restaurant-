<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | Abir Restaurant</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f8f8f8;
color: #222;
}

header {
background: #111;
color: white;
padding: 18px 7%;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
}

.logo {
font-size: 24px;
font-weight: bold;
letter-spacing: 1px;
}

nav a {
color: white;
text-decoration: none;
margin-left: 20px;
font-size: 14px;
}

.hero {
background:
linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)),
url("https://commons.wikimedia.org/wiki/Special:FilePath/A%20Nigeria%20Jollof%20Rice%20with%20chicken.jpg?width=1600")
center/cover;

color: white;
text-align: center;
padding: 70px 20px;
}

.hero h1 {
font-size: 40px;
margin: 0 0 10px;
}

.hero p {
margin: 0;
font-size: 17px;
}

.container {
width: 92%;
max-width: 1100px;
margin: 40px auto;
}

.cart-section,
.customer-section {
background: white;
border-radius: 14px;
padding: 25px;
margin-bottom: 25px;
box-shadow: 0 5px 18px rgba(0,0,0,.07);
}

.cart-section h2,
.customer-section h2 {
margin-top: 0;
}

.cart-item {
display: flex;
align-items: center;
gap: 15px;
border-bottom: 1px solid #eee;
padding: 18px 0;
}

.cart-item:last-child {
border-bottom: none;
}

.item-image {
width: 95px;
height: 80px;
object-fit: cover;
border-radius: 10px;
flex-shrink: 0;
}

.item-info {
flex: 1;
}

.item-info h3 {
margin: 0 0 6px;
font-size: 17px;
}

.item-price {
color: #666;
font-size: 14px;
}

.item-subtotal {
font-weight: bold;
margin-top: 5px;
}

.quantity-controls {
display: flex;
align-items: center;
gap: 8px;
}

.quantity-controls button {
width: 34px;
height: 34px;
border: none;
background: #eee;
border-radius: 6px;
cursor: pointer;
font-size: 18px;
}

.quantity {
min-width: 25px;
text-align: center;
font-weight: bold;
}

.remove-btn {
border: none;
background: transparent;
color: #c00;
cursor: pointer;
font-size: 13px;
}

.total {
text-align: right;
font-size: 22px;
font-weight: bold;
padding-top: 20px;
}

.form-group {
margin-bottom: 18px;
}

.form-group label {
display: block;
font-weight: bold;
margin-bottom: 7px;
}

.form-group input,
.form-group select,
.form-group textarea {
width: 100%;
padding: 13px;
border: 1px solid #ddd;
border-radius: 7px;
font-size: 15px;
font-family: inherit;
}

.form-group textarea {
min-height: 100px;
resize: vertical;
}

.order-type {
display: flex;
gap: 20px;
flex-wrap: wrap;
}

.order-type label {
font-weight: normal;
}

#addressGroup {
display: none;
}

.whatsapp-btn {
width: 100%;
border: none;
background: #111;
color: white;
padding: 16px;
border-radius: 8px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
}

.empty-cart {
text-align: center;
padding: 35px 10px;
color: #666;
}

.back-link {
display: inline-block;
color: #111;
text-decoration: none;
margin-top: 20px;
}

footer {
background: #111;
color: white;
text-align: center;
padding: 25px;
margin-top: 60px;
}

@media (max-width: 600px) {

header {
justify-content: center;
text-align: center;
gap: 15px;
}

nav a {
margin: 0 6px;
font-size: 13px;
}

.hero h1 {
font-size: 32px;
}

.cart-section,
.customer-section {
padding: 18px;
}

.cart-item {
align-items: flex-start;
flex-wrap: wrap;
}

.item-image {
width: 80px;
height: 70px;
}

.item-info {
min-width: calc(100% - 100px);
}

.quantity-controls {
margin-left: 95px;
}

.remove-btn {
margin-left: auto;
}

.total {
font-size: 20px;
}
}
</style>
</head>

<body>

<header>

<div class="logo">ABIR RESTAURANT</div>

<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="order.html">Order From Home</a>
</nav>

</header>


<section class="hero">

<h1>Your Cart</h1>

<p>Review your order before checkout.</p>

</section>


<div class="container">

<section class="cart-section">

<h2>Your Order</h2>

<div id="cartContainer"></div>

<div id="cartTotal" class="total"></div>

</section>


<section class="customer-section">

<h2>Customer Information</h2>

<div class="form-group">

<label for="customerName">
Full Name
</label>

<input
type="text"
id="customerName"
placeholder="Enter your full name"
>

</div>


<div class="form-group">

<label for="customerPhone">
Phone Number
</label>

<input
type="tel"
id="customerPhone"
placeholder="Enter your phone number"
>

</div>


<div class="form-group">

<label>
Order Type
</label>

<div class="order-type">

<label>
<input
type="radio"
name="orderType"
value="Delivery"
checked
>
Delivery
</label>

<label>
<input
type="radio"
name="orderType"
value="Pickup"
>
Pickup
</label>

</div>

</div>


<div
class="form-group"
id="addressGroup"
>

<label for="customerAddress">
Delivery Address
</label>

<textarea
id="customerAddress"
placeholder="Enter your delivery address"
></textarea>

</div>


<div class="form-group">

<label for="customerNote">
Additional Note
</label>

<textarea
id="customerNote"
placeholder="Any special request?"
></textarea>

</div>


<button
class="whatsapp-btn"
type="button"
id="whatsappOrder"
>
Order on WhatsApp
</button>

</section>

</div>


<footer>

© 2026 Abir Restaurant. All rights reserved.

</footer>


<script>

const whatsappNumber = "2349066324358";


const foodImages = {

"Jollof Rice & Chicken":
"https://commons.wikimedia.org/wiki/Special:FilePath/A%20Nigeria%20Jollof%20Rice%20with%20chicken.jpg?width=800",

"Fried Rice & Chicken":
"https://commons.wikimedia.org/wiki/Special:FilePath/Fried%20Rice%2C%20Jollof%20rice%20and%20salad%2C%20served%20with%20Grilled%20Chicken.jpg?width=800",

"Ofada Rice & Ayamase":
"https://commons.wikimedia.org/wiki/Special:FilePath/Ofada%20Rice.jpg?width=800",

"Beans & Plantain":
"https://commons.wikimedia.org/wiki/Special:FilePath/Beans%20and%20plantain.jpg?width=800",

"Yam Porridge":
"https://www.allnigerianrecipes.com/wp-content/uploads/2020/07/yam-porridge.jpg",

"Amala & Ewedu":
"https://commons.wikimedia.org/wiki/Special:FilePath/Amala%20and%20ewedu%20soup.jpg?width=800",

"Pounded Yam & Egusi":
"https://commons.wikimedia.org/wiki/Special:FilePath/Pounded%20yam%20and%20Egusi%20soup.jpg?width=800",

"Eba & Egusi":
"https://commons.wikimedia.org/wiki/Special:FilePath/Eba%20and%20Egusi%20soup.JPG?width=800",

"Semo & Vegetable Soup":
"https://commons.wikimedia.org/wiki/Special:FilePath/Swallow%20from%20Nigeria.JPG?width=800",

"Grilled Chicken":
"https://www.allnigerianrecipes.com/wp-content/uploads/2020/07/grilled-chicken.jpg",

"Beef Suya":
"https://static.wixstatic.com/media/77ee2b_4a43a05d679f450e96ae75a8d8619dfe~mv2.jpg",

"Grilled Fish":
"https://i.pinimg.com/originals/dd/f0/c6/ddf0c6c3e8a9e26a1110313b4881cfda.jpg",

"Asun":
"https://shopafricausa.com/cdn/shop/articles/Asun-recipe-IG-1_1080x.jpg?v=1578835216",

"Beef Burger":
"https://chowdeck.com/store/_next/image?q=75&url=https%3A%2F%2Ffiles.chowdeck.com%2Ffit-in%2F1200x675%2Fimages%2Fdg6lxybuf10cl2h1czby2%2F1688204706.png&w=3840",

"Chicken & Chips":
"https://mindtrip.ai/restaurants/2da2/b122/cb31/f7c8/884c/2848/4571/7c1f",

"Puff Puff":
"https://www.artofit.org/particle/418905202861001295/easy-nigerian-puff-puff/",

"Samosa":
"https://shopafricausa.com/cdn/shop/articles/butter_samosa-e1503561620296_1200x1200.jpg?v=1687169701",

"Spring Rolls":
"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80",

"Gizdodo":
"https://greatgracekitchenandgrocery.com/cdn/shop/files/Gizdodo_PepperedGizzardandPlantains_-CookingWithClaudy_1200x630.jpg?v=1748019478",

"Chapman":
"https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=800&q=80",

"Zobo":
"https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=800&q=80",

"Fresh Pineapple Juice":
"https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=800&q=80",

"Watermelon Juice":
"https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=800&q=80",

"Mojito":
"https://images.unsplash.com/photo-1551538827-9c037cb4f32a?auto=format&fit=crop&w=800&q=80",

"Strawberry Mojito":
"https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=800&q=80",

"Pina Colada":
"https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=800&q=80",

"Passion Fruit Cocktail":
"https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=800&q=80",

"Fried Plantain":
"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80",

"French Fries":
"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=800&q=80",

"Coleslaw":
"https://images.unsplash.com/photo-1546793665-c74683f339c1?auto=format&fit=crop&w=800&q=80",

"Moi Moi":
"https://cdn.shopify.com/s/files/1/0012/5337/6060/articles/moi_moi_1024x.jpg?v=1611605450"

};


function getCart() {

const savedCart =
localStorage.getItem("comfortCart");

if (!savedCart) {
return [];
}

try {
return JSON.parse(savedCart);
}

catch (error) {
return [];
}
}


function saveCart(cart) {

localStorage.setItem(
"comfortCart",
JSON.stringify(cart)
);

}


function displayCart() {

const cart = getCart();

const container =
document.getElementById("cartContainer");

const totalElement =
document.getElementById("cartTotal");


container.innerHTML = "";


if (cart.length === 0) {

container.innerHTML = `

<div class="empty-cart">

<p>Your cart is empty.</p>

<a
class="back-link"
href="order.html"
>
Browse Menu
</a>

</div>

`;

totalElement.textContent = "";

return;

}


let total = 0;


cart.forEach((item, index) => {

const quantity =
Number(item.quantity) || 1;

const price =
Number(item.price) || 0;

const subtotal =
price * quantity;

total += subtotal;


const image =
foodImages[item.name] || "";


const cartItem =
document.createElement("div");

cartItem.className = "cart-item";


cartItem.innerHTML = `

<img
class="item-image"
src="${image}"
alt="${item.name}"
>

<div class="item-info">

<h3>
${item.name}
</h3>

<div class="item-price">
₦${price.toLocaleString()} each
</div>

<div class="item-subtotal">
₦${subtotal.toLocaleString()}
</div>

</div>


<div class="quantity-controls">

<button
type="button"
onclick="changeQuantity(${index}, -1)"
>
−
</button>

<span class="quantity">
${quantity}
</span>

<button
type="button"
onclick="changeQuantity(${index}, 1)"
>
+
</button>

</div>


<button
class="remove-btn"
type="button"
onclick="removeItem(${index})"
>
Remove
</button>

`;


container.appendChild(cartItem);

});


totalElement.textContent =
"Total: ₦" + total.toLocaleString();

}


function changeQuantity(index, change) {

const cart = getCart();

if (!cart[index]) {
return;
}


cart[index].quantity =
Number(cart[index].quantity) + change;


if (cart[index].quantity <= 0) {

cart.splice(index, 1);

}


saveCart(cart);

displayCart();

}


function removeItem(index) {

const cart = getCart();

cart.splice(index, 1);

saveCart(cart);

displayCart();

}


document
.querySelectorAll('input[name="orderType"]')
.forEach(radio => {

radio.addEventListener("change", function() {

const addressGroup =
document.getElementById("addressGroup");


if (this.value === "Delivery") {

addressGroup.style.display = "block";

}

else {

addressGroup.style.display = "none";

}

});

});


function orderOnWhatsApp() {

const cart = getCart();


if (cart.length === 0) {

alert("Your cart is empty.");

return;

}


const name =
document
.getElementById("customerName")
.value
.trim();


const phone =
document
.getElementById("customerPhone")
.value
.trim();


const orderType =
document
.querySelector(
'input[name="orderType"]:checked'
)
.value;


const address =
document
.getElementById("customerAddress")
.value
.trim();


const note =
document
.getElementById("customerNote")
.value
.trim();


if (!name || !phone) {

alert(
"Please enter your name and phone number."
);

return;

}


if (
orderType === "Delivery" &&
!address
) {

alert(
"Please enter your delivery address."
);

return;

}


let message =
"Hello Abir Restaurant,%0A%0A";

message +=
"*New Order*%0A%0A";


message +=
"*Customer:* " +
encodeURIComponent(name) +
"%0A";


message +=
"*Phone:* " +
encodeURIComponent(phone) +
"%0A";


message +=
"*Order Type:* " +
encodeURIComponent(orderType) +
"%0A";


if (orderType === "Delivery") {

message +=
"*Address:* " +
encodeURIComponent(address) +
"%0A";

}


message += "%0A*Items:*%0A";


let total = 0;


cart.forEach(item => {

const quantity =
Number(item.quantity) || 1;

const price =
Number(item.price) || 0;

const subtotal =
quantity * price;

total += subtotal;


message +=
encodeURIComponent(
item.name
) +
" x" +
quantity +
" - ₦" +
subtotal.toLocaleString() +
"%0A";

});


message +=
"%0A*Total:* ₦" +
total.toLocaleString();


if (note) {

message +=
"%0A%0A*Additional Note:* " +
encodeURIComponent(note);

}


const whatsappURL =
"https://wa.me/" +
whatsappNumber +
"?text=" +
message;


window.location.href =
whatsappURL;

}


document
.getElementById("whatsappOrder")
.addEventListener(
"click",
orderOnWhatsApp
);


displayCart();

</script>

</body>
</html>
