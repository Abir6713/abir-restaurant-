<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | Abir Restaurant</title>

<style>
* {
 box-sizing: border-box;
}

body {
 margin: 0;
 font-family: Arial, sans-serif;
 background: #f7f7f7;
 color: #222;
}

header {
 background: #111;
 color: white;
 padding: 18px 6%;
 display: flex;
 justify-content: space-between;
 align-items: center;
 flex-wrap: wrap;
 gap: 15px;
}

.logo {
 font-size: 22px;
 font-weight: bold;
}

nav {
 display: flex;
 gap: 16px;
 flex-wrap: wrap;
}

nav a {
 color: white;
 text-decoration: none;
 font-size: 14px;
}

nav a:hover {
 color: #f0b429;
}

.hero {
 background:
 linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
 url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80")
 center/cover;
 color: white;
 text-align: center;
 padding: 60px 6%;
}

.hero h1 {
 margin: 0 0 10px;
 font-size: 38px;
}

.hero p {
 margin: 0;
}

.container {
 width: 90%;
 max-width: 900px;
 margin: 40px auto;
}

.cart-box,
.checkout-box {
 background: white;
 padding: 25px;
 border-radius: 10px;
 box-shadow: 0 4px 15px rgba(0,0,0,.08);
 margin-bottom: 25px;
}

.cart-item {
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 15px;
 border-bottom: 1px solid #ddd;
 padding: 18px 0;
}

.cart-item:last-child {
 border-bottom: none;
}

.item-info h3 {
 margin: 0 0 7px;
}

.item-price {
 color: #666;
 font-size: 14px;
}

.quantity-controls {
 display: flex;
 align-items: center;
 gap: 8px;
}

.quantity-controls button {
 border: none;
 background: #111;
 color: white;
 width: 34px;
 height: 34px;
 border-radius: 5px;
 cursor: pointer;
 font-size: 18px;
}

.quantity {
 min-width: 25px;
 text-align: center;
 font-weight: bold;
}

.remove {
 border: none;
 background: #d32f2f;
 color: white;
 padding: 9px 12px;
 border-radius: 5px;
 cursor: pointer;
}

.total {
 text-align: right;
 font-size: 23px;
 font-weight: bold;
 margin-top: 20px;
}

.empty {
 text-align: center;
 padding: 30px 10px;
 color: #666;
}

.form-group {
 margin-bottom: 18px;
}

label {
 display: block;
 margin-bottom: 7px;
 font-weight: bold;
}

input,
select,
textarea {
 width: 100%;
 padding: 13px;
 border: 1px solid #ccc;
 border-radius: 6px;
 font-size: 16px;
}

textarea {
 min-height: 100px;
 resize: vertical;
}

.whatsapp-button {
 width: 100%;
 border: none;
 background: #25D366;
 color: white;
 padding: 16px;
 border-radius: 6px;
 font-size: 17px;
 font-weight: bold;
 cursor: pointer;
 margin-top: 10px;
}

.continue {
 display: inline-block;
 background: #111;
 color: white;
 text-decoration: none;
 padding: 13px 20px;
 border-radius: 6px;
 margin-top: 15px;
}

footer {
 background: #111;
 color: white;
 text-align: center;
 padding: 25px;
 margin-top: 50px;
}

@media (max-width: 600px) {

 header {
 padding: 16px 5%;
 }

 .hero h1 {
 font-size: 30px;
 }

 .cart-item {
 flex-direction: column;
 align-items: flex-start;
 }

 .quantity-controls {
 margin-top: 5px;
 }

 .total {
 text-align: left;
 }
}
</style>
</head>

<body>

<header>

<div class="logo">
ABIR RESTAURANT
</div>

<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="order.html">Order From Home</a>
<a href="cart.html">View Cart</a>
</nav>

</header>


<section class="hero">

<h1>Your Cart</h1>

<p>Review your order before checking out.</p>

</section>


<div class="container">


<div class="cart-box">

<h2>Order Summary</h2>

<div id="cartItems"></div>

<div class="total">
Total: ₦<span id="cartTotal">0</span>
</div>

<a href="order.html" class="continue">
Continue Shopping
</a>

</div>


<div class="checkout-box">

<h2>Checkout</h2>

<div class="form-group">

<label for="customerName">
Name
</label>

<input
type="text"
id="customerName"
placeholder="Enter your name"
>

</div>


<div class="form-group">

<label for="customerPhone">
Phone Number
</label>

<input
type="tel"
id="customerPhone"
placeholder="Enter your phone number"
>

</div>


<div class="form-group">

<label for="orderType">
Order Type
</label>

<select id="orderType">

<option value="Delivery">
Delivery
</option>

<option value="Pickup">
Pickup
</option>

</select>

</div>


<div class="form-group" id="addressGroup">

<label for="customerAddress">
Delivery Address
</label>

<textarea
id="customerAddress"
placeholder="Enter your delivery address"
></textarea>

</div>


<div class="form-group">

<label for="orderNote">
Additional Note
</label>

<textarea
id="orderNote"
placeholder="Any special request?"
></textarea>

</div>


<button
class="whatsapp-button"
onclick="orderOnWhatsApp()"
>
Order on WhatsApp
</button>

</div>

</div>


<footer>

© 2026 Abir Restaurant. All rights reserved.

</footer>


<script>

function getCart() {

 let savedCart = localStorage.getItem("comfortCart");

 if (!savedCart) {
 return [];
 }

 try {
 return JSON.parse(savedCart);
 } catch (error) {
 return [];
 }

}


function saveCart(cart) {

 localStorage.setItem(
 "comfortCart",
 JSON.stringify(cart)
 );

}


function displayCart() {

 let cart = getCart();

 let container =
 document.getElementById("cartItems");

 let totalElement =
 document.getElementById("cartTotal");

 if (cart.length === 0) {

 container.innerHTML =
 '<div class="empty">' +
 'Your cart is empty.<br><br>' +
 '<a href="order.html">Go to Menu</a>' +
 '</div>';

 totalElement.textContent = "0";

 return;

 }


 let total = 0;

 container.innerHTML = "";


 cart.forEach(function(item, index) {

 let itemTotal =
 item.price * item.quantity;

 total += itemTotal;


 let div =
 document.createElement("div");

 div.className = "cart-item";


 div.innerHTML = `

 <div class="item-info">

 <h3>${item.name}</h3>

 <div class="item-price">
 ₦${item.price.toLocaleString()}
 each
 </div>

 </div>


 <div class="quantity-controls">

 <button onclick="changeQuantity(${index}, -1)">
 −
 </button>

 <span class="quantity">
 ${item.quantity}
 </span>

 <button onclick="changeQuantity(${index}, 1)">
 +
 </button>

 <button class="remove" onclick="removeItem(${index})">
 Remove
 </button>

 </div>

 `;


 container.appendChild(div);

 });


 totalElement.textContent =
 total.toLocaleString();

}


function changeQuantity(index, change) {

 let cart = getCart();

 if (!cart[index]) {
 return;
 }


 cart[index].quantity += change;


 if (cart[index].quantity <= 0) {

 cart.splice(index, 1);

 }


 saveCart(cart);

 displayCart();

}


function removeItem(index) {

 let cart = getCart();

 cart.splice(index, 1);

 saveCart(cart);

 displayCart();

}


document
.getElementById("orderType")
.addEventListener("change", function() {

 let addressGroup =
 document.getElementById("addressGroup");

 if (this.value === "Pickup") {

 addressGroup.style.display = "none";

 } else {

 addressGroup.style.display = "block";

 }

});


function orderOnWhatsApp() {

 let cart = getCart();


 if (cart.length === 0) {

 alert("Your cart is empty.");

 return;

 }


 let customerName =
 document
 .getElementById("customerName")
 .value
 .trim();


 let customerPhone =
 document
 .getElementById("customerPhone")
 .value
 .trim();


 let orderType =
 document
 .getElementById("orderType")
 .value;


 let address =
 document
 .getElementById("customerAddress")
 .value
 .trim();


 let note =
 document
 .getElementById("orderNote")
 .value
 .trim();


 if (customerName === "") {

 alert("Please enter your name.");

 return;

 }


 if (customerPhone === "") {

 alert("Please enter your phone number.");

 return;

 }


 if (
 orderType === "Delivery" &&
 address === ""
 ) {

 alert("Please enter your delivery address.");

 return;

 }


 let message =
 "Hello Abir Restaurant,\n\n";

 message +=
 "I would like to place an order.\n\n";

 message +=
 "ORDER:\n";


 let total = 0;


 cart.forEach(function(item) {

 let itemTotal =
 item.price * item.quantity;

 total += itemTotal;


 message +=
 item.name +
 " x " +
 item.quantity +
 " - ₦" +
 itemTotal.toLocaleString() +
 "\n";

 });


 message +=
 "\nTOTAL: ₦" +
 total.toLocaleString() +
 "\n\n";


 message +=
 "CUSTOMER DETAILS:\n";


 message +=
 "Name: " +
 customerName +
 "\n";


 message +=
 "Phone: " +
 customerPhone +
 "\n";


 message +=
 "Order Type: " +
 orderType +
 "\n";


 if (orderType === "Delivery") {

 message +=
 "Address: " +
 address +
 "\n";

 }


 if (note !== "") {

 message +=
 "Note: " +
 note +
 "\n";

 }


 message +=
 "\nPlease confirm my order. Thank you.";


 let phoneNumber =
 "2349066324358";


 let whatsappURL =
 "https://wa.me/" +
 phoneNumber +
 "?text=" +
 encodeURIComponent(message);


 window.location.href =
 whatsappURL;

}


displayCart();

</script>

</body>
</html>
