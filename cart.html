<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Your Order | Comfort Grills & Bites</title>

 <style>
 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 }

 body {
 font-family: Arial, sans-serif;
 background: #fffaf5;
 color: #222;
 line-height: 1.6;
 }

 header {
 background: #111;
 color: white;
 padding: 20px;
 text-align: center;
 }

 header h1 {
 font-size: 24px;
 }

 .container {
 max-width: 850px;
 margin: 40px auto;
 padding: 20px;
 }

 .back {
 display: inline-block;
 margin-bottom: 25px;
 color: #e85d04;
 text-decoration: none;
 font-weight: bold;
 }

 .cart-box {
 background: white;
 padding: 25px;
 border-radius: 10px;
 box-shadow: 0 4px 15px rgba(0,0,0,0.08);
 }

 .cart-box h2 {
 margin-bottom: 20px;
 }

 .cart-item {
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 15px;
 padding: 18px 0;
 border-bottom: 1px solid #eee;
 }

 .item-info h3 {
 margin-bottom: 5px;
 }

 .item-price {
 color: #e85d04;
 font-weight: bold;
 }

 .quantity {
 display: flex;
 align-items: center;
 gap: 10px;
 }

 .quantity button {
 border: none;
 background: #111;
 color: white;
 width: 30px;
 height: 30px;
 border-radius: 5px;
 cursor: pointer;
 font-size: 18px;
 }

 .remove {
 border: none;
 background: transparent !important;
 color: #d00000 !important;
 cursor: pointer;
 width: auto !important;
 font-size: 14px !important;
 }

 .total {
 display: flex;
 justify-content: space-between;
 font-size: 22px;
 font-weight: bold;
 padding: 25px 0;
 border-bottom: 1px solid #eee;
 }

 .customer-details {
 margin-top: 30px;
 }

 .customer-details h2 {
 margin-bottom: 20px;
 }

 .form-group {
 margin-bottom: 18px;
 }

 .form-group label {
 display: block;
 font-weight: bold;
 margin-bottom: 7px;
 }

 .form-group input,
 .form-group select,
 .form-group textarea {
 width: 100%;
 padding: 13px;
 border: 1px solid #ccc;
 border-radius: 6px;
 font-size: 15px;
 font-family: Arial, sans-serif;
 }

 .form-group textarea {
 min-height: 100px;
 resize: vertical;
 }

 .order-btn {
 display: block;
 width: 100%;
 background: #25D366;
 color: white;
 text-align: center;
 padding: 15px;
 border-radius: 6px;
 font-size: 17px;
 font-weight: bold;
 border: none;
 cursor: pointer;
 margin-top: 25px;
 }

 .empty {
 text-align: center;
 padding: 40px 10px;
 color: #666;
 }

 .continue {
 display: block;
 text-align: center;
 margin-top: 20px;
 color: #e85d04;
 text-decoration: none;
 }

 @media (max-width: 600px) {

 .cart-item {
 display: block;
 }

 .quantity {
 margin-top: 12px;
 }

 .remove {
 margin-left: 10px;
 }
 }
 </style>
</head>

<body>

<header>
 <h1>Comfort Grills & Bites</h1>
</header>


<div class="container">

 <a href="index.html" class="back">
 ← Back to Menu
 </a>


 <div class="cart-box">

 <h2>Your Order</h2>

 <div id="cartItems"></div>

 <div class="total">
 <span>Total</span>
 <span id="cartTotal">₦0</span>
 </div>


 <div class="customer-details">

 <h2>Order Details</h2>


 <div class="form-group">

 <label for="customerName">
 Your Name
 </label>

 <input
 type="text"
 id="customerName"
 placeholder="Enter your name"
 >

 </div>


 <div class="form-group">

 <label for="customerPhone">
 Phone Number
 </label>

 <input
 type="tel"
 id="customerPhone"
 placeholder="Enter your phone number"
 >

 </div>


 <div class="form-group">

 <label for="orderType">
 Order Type
 </label>

 <select id="orderType" onchange="toggleAddress()">

 <option value="Delivery">
 Delivery
 </option>

 <option value="Pickup">
 Pickup
 </option>

 </select>

 </div>


 <div class="form-group" id="addressGroup">

 <label for="customerAddress">
 Delivery Address
 </label>

 <textarea
 id="customerAddress"
 placeholder="Enter your delivery address"
 ></textarea>

 </div>


 <div class="form-group">

 <label for="orderNote">
 Additional Note
 </label>

 <textarea
 id="orderNote"
 placeholder="Any special request? (Optional)"
 ></textarea>

 </div>


 <button
 class="order-btn"
 onclick="orderOnWhatsApp()">

 Order on WhatsApp

 </button>

 </div>


 <a href="index.html" class="continue">
 Continue Shopping
 </a>

 </div>

</div>


<script>

function getCart() {

 return JSON.parse(
 localStorage.getItem("comfortCart")
 ) || [];

}


function saveCart(cart) {

 localStorage.setItem(
 "comfortCart",
 JSON.stringify(cart)
 );

}


function formatPrice(price) {

 return "₦" + price.toLocaleString();

}


function displayCart() {

 let cart = getCart();

 let cartItems =
 document.getElementById("cartItems");

 let cartTotal =
 document.getElementById("cartTotal");


 cartItems.innerHTML = "";


 if (cart.length === 0) {

 cartItems.innerHTML = `
 <div class="empty">
 <h3>Your cart is empty.</h3>
 <p>Add something delicious from our menu.</p>
 </div>
 `;

 cartTotal.textContent = "₦0";

 return;

 }


 let total = 0;


 cart.forEach(function(item, index) {

 let itemTotal =
 item.price * item.quantity;

 total += itemTotal;


 cartItems.innerHTML += `

 <div class="cart-item">

 <div class="item-info">

 <h3>${item.name}</h3>

 <div class="item-price">
 ${formatPrice(item.price)} each
 </div>

 </div>


 <div class="quantity">

 <button
 onclick="changeQuantity(${index}, -1)">
 −
 </button>

 <strong>
 ${item.quantity}
 </strong>

 <button
 onclick="changeQuantity(${index}, 1)">
 +
 </button>

 <button
 class="remove"
 onclick="removeItem(${index})">

 Remove

 </button>

 </div>

 </div>

 `;

 });


 cartTotal.textContent =
 formatPrice(total);

}


function changeQuantity(index, amount) {

 let cart = getCart();


 cart[index].quantity += amount;


 if (cart[index].quantity <= 0) {

 cart.splice(index, 1);

 }


 saveCart(cart);

 displayCart();

}


function removeItem(index) {

 let cart = getCart();


 cart.splice(index, 1);


 saveCart(cart);

 displayCart();

}


function toggleAddress() {

 let orderType =
 document.getElementById("orderType").value;

 let addressGroup =
 document.getElementById("addressGroup");


 if (orderType === "Pickup") {

 addressGroup.style.display = "none";

 } else {

 addressGroup.style.display = "block";

 }

}


function orderOnWhatsApp() {

 let cart = getCart();


 if (cart.length === 0) {

 alert("Your cart is empty.");

 return;

 }


 let customerName =
 document.getElementById("customerName").value.trim();


 let customerPhone =
 document.getElementById("customerPhone").value.trim();


 let orderType =
 document.getElementById("orderType").value;


 let address =
 document.getElementById("customerAddress").value.trim();


 let note =
 document.getElementById("orderNote").value.trim();


 if (customerName === "") {

 alert("Please enter your name.");

 return;

 }


 if (customerPhone === "") {

 alert("Please enter your phone number.");

 return;

 }


 if (
 orderType === "Delivery" &&
 address === ""
 ) {

 alert("Please enter your delivery address.");

 return;

 }


 let message =
 "Hello Comfort Grills & Bites,%0A%0A";

 message +=
 "I would like to place an order.%0A%0A";


 message +=
 "*ORDER:%*%0A";


 let total = 0;


 cart.forEach(function(item) {

 let itemTotal =
 item.price * item.quantity;


 total += itemTotal;


 message +=
 item.name +
 " x " +
 item.quantity +
 " - " +
 formatPrice(itemTotal) +
 "%0A";

 });


 message += "%0A";


 message +=
 "*TOTAL: " +
 formatPrice(total) +
 "*%0A%0A";


 message +=
 "*CUSTOMER DETAILS:*%0A";


 message +=
 "Name: " +
 customerName +
 "%0A";


 message +=
 "Phone: " +
 customerPhone +
 "%0A";


 message +=
 "Order Type: " +
 orderType +
 "%0A";


 if (orderType === "Delivery") {

 message +=
 "Address: " +
 address +
 "%0A";

 }


 if (note !== "") {

 message +=
 "Note: " +
 note +
 "%0A";

 }


 message += "%0A";

 message +=
 "Please confirm my order. Thank you.";


 /*
 COMFORT GRILLS & BITES
 WhatsApp number:
 09066324358

 International format:
 2349066324358
 */


 let phoneNumber =
 "2349066324358";


 let whatsappURL =
 "https://wa.me/" +
 phoneNumber +
 "?text=" +
 message;


 window.open(
 whatsappURL,
 "_blank"
 );

}


displayCart();

toggleAddress();

</script>

</body>
</html>
