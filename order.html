    }

    .hero {

    }

    .container {
        max-width: 1200px;

        padding: 0 20px;

    .search-box {
        margin-bottom: 25px;
    }

    .search-box input {

        padding: 15px 18px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    .search-box input:focus {
        border-color: #111;
    }

    .categories {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 30px;
    }

    .category-btn {
        padding: 10px 16px;
        border: 1px solid #222;
        background: white;
        color: #222;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
    }

    .category-btn.active,
    .category-btn:hover {

        color: white;
    }

    .section-title {
        font-size: 28px;
        margin-bottom: 20px;
    }

    .food-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .food-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .food-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;

    .food-content {

        margin-bottom: 8px;
        font-size: 20px;
    }

    .category-name {

        font-size: 13px;
        margin-bottom: 10px;

    .description {

        margin-bottom: 12px;
        font-size: 14px;
    }

    .price {

        font-weight: bold;
        margin-bottom: 15px;
    }

    .food-actions {
        display: flex;
        gap: 10px;
    }

    .food-actions a,
    .food-actions button {
        flex: 1;
        padding: 11px;
        border-radius: 6px;
        font-size: 14px;
        text-align: center;
        cursor: pointer;
        text-decoration: none;
    }

    .details-btn {
        background: white;
        color: #111;
        border: 1px solid #111;
    }

    .add-btn {
        background: #111;
        color: white;
        border: 1px solid #111;
    }

    .add-btn:hover {
        background: #333;
    }

    .cart-section {
        text-align: center;
        margin: 40px 0;
    }

    .cart-button {
        display: inline-block;
        background: #111;
        color: white;
        padding: 15px 25px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: bold;
    }

        display: none;
    }

    footer {
        background: #111;
        color: white;
        text-align: center;
        padding: 25px 20px;

    }

function getCart() {
    const savedCart = localStorage.getItem("comfortCart");

    if (!savedCart) {
        return [];
    }

    try {
        return JSON.parse(savedCart);
    } catch (error) {
        return [];
    }
}

function saveCart(cart) {
    localStorage.setItem("comfortCart", JSON.stringify(cart));
}

function addToCart(key) {

    const food = foods.find(function(item) {
        return item.key === key;
    });

    if (!food) {
        return;
    }

    const cart = getCart();

    const existingItem = cart.find(function(item) {
        return item.key === key;
    });

    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({
            key: food.key,
            name: food.name,
            price: food.price,
            quantity: 1
        });
    }

    saveCart(cart);

    updateCartCounter();

    alert(food.name + " added to cart.");
}

function updateCartCounter() {

    const cart = getCart();

    let totalItems = 0;

    cart.forEach(function(item) {
        totalItems += Number(item.quantity) || 0;
    });

    const counter = document.getElementById("cartCount");

    if (totalItems > 0) {
        counter.textContent = " (" + totalItems + ")";
    } else {
        counter.textContent = "";
    }
}

function renderMenu() {

    const searchText = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const activeButton = document.querySelector(
        ".category-btn.active"
    );

    const selectedCategory = activeButton
        ? activeButton.dataset.category
        : "All";

    const menuContainer =
        document.getElementById("menuContainer");

    const emptyMessage =
        document.getElementById("emptyMessage");

    const filteredFoods = foods.filter(function(food) {

        const matchesSearch =
            food.name.toLowerCase().includes(searchText);

        const matchesCategory =
            selectedCategory === "All" ||
            food.category === selectedCategory;

        return matchesSearch && matchesCategory;
    });

    menuContainer.innerHTML = "";

    if (filteredFoods.length === 0) {

        emptyMessage.style.display = "block";

        return;
    }

    emptyMessage.style.display = "none";

    filteredFoods.forEach(function(food) {

        const card = document.createElement("div");

        card.className = "food-card";

        card.innerHTML = `

            <img
                src="${food.image}"
                alt="${food.name}"
            >

            <div class="food-content">

                <h3>${food.name}</h3>

                <div class="category-name">
                    ${food.category}
                </div>

                <p class="description">
                    ${food.description}
                </p>

                <div class="price">
                    ₦${food.price.toLocaleString()}
                </div>

                <div class="food-actions">

                    <a
                        href="details.html?item=${food.key}&mode=order"
                        class="details-btn"
                    >
                        Details
                    </a>

                    <button
                        class="add-btn"
                        onclick="addToCart('${food.key}')"
                    >
                        Add to Cart
                    </button>

                </div>

            </div>
        `;

        menuContainer.appendChild(card);
    });
}

document
    .getElementById("searchInput")
    .addEventListener("input", function() {
        renderMenu();
    });

document

    .forEach(function(button) {

        button.addEventListener("click", function() {

            document
                .querySelectorAll(".category-btn")
                .forEach(function(btn) {
                    btn.classList.remove("active");
                });

            this.classList.add("active");

            renderMenu();
        });
    });
