<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Details - Comfort Grills & Bites</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f8f8f8;
color: #222;
}


/* HEADER */

header {
background: #111;
color: white;
padding: 18px 25px;

display: flex;
justify-content: space-between;
align-items: center;

position: sticky;
top: 0;
z-index: 100;
}

.logo {
font-size: 20px;
font-weight: bold;
letter-spacing: 1px;
}

.cart-button {
background: #25D366;
color: white;

padding: 10px 16px;

border-radius: 25px;

text-decoration: none;

font-weight: bold;
}


/* MAIN */

.container {
max-width: 1100px;
margin: auto;
padding: 40px 20px;
}


/* BACK */

.back-link {
display: inline-block;

margin-bottom: 25px;

color: #111;

text-decoration: none;

font-weight: bold;
}


/* PRODUCT */

.product {
background: white;

border-radius: 18px;

overflow: hidden;

box-shadow:
0 5px 25px rgba(0,0,0,0.08);

display: grid;

grid-template-columns: 1fr 1fr;
}


/* IMAGE */

.product-image {
width: 100%;
height: 100%;

min-height: 500px;

object-fit: cover;
}


/* INFORMATION */

.product-info {
padding: 45px;
}

.product-info h1 {
font-size: 38px;

margin-top: 0;

margin-bottom: 15px;
}

.price {
font-size: 28px;

font-weight: bold;

color: #111;

margin-bottom: 25px;
}

.description {
color: #666;

font-size: 17px;

line-height: 1.7;

margin-bottom: 30px;
}


/* FEATURES */

.features {
margin-bottom: 30px;
}

.features h3 {
margin-bottom: 15px;
}

.features ul {
padding-left: 20px;
}

.features li {
margin-bottom: 10px;

color: #555;
}


/* BUTTONS */

.buttons {
display: flex;

flex-direction: column;

gap: 12px;
}

.add-button,
.order-button,
.cart-button-large {

width: 100%;

padding: 15px;

border: none;

border-radius: 8px;

font-size: 17px;

font-weight: bold;

cursor: pointer;

text-align: center;

text-decoration: none;
}

.add-button {
background: #25D366;

color: white;
}

.order-button {
background: #111;

color: white;
}

.cart-button-large {
background: #eee;

color: #111;
}


/* MESSAGE */

.message {
margin-top: 20px;

padding: 12px;

background: #e9f9ef;

color: #16833e;

border-radius: 7px;

text-align: center;

display: none;
}


/* FOOTER */

footer {
background: #111;

color: #aaa;

text-align: center;

padding: 25px 15px;

margin-top: 50px;
}

footer strong {
color: white;
}


/* MOBILE */

@media (max-width: 750px) {

header {
padding: 15px;
}

.logo {
font-size: 16px;
}

.cart-button {
padding: 8px 12px;
font-size: 13px;
}

.product {
grid-template-columns: 1fr;
}

.product-image {
min-height: 320px;
height: 320px;
}

.product-info {
padding: 30px 22px;
}

.product-info h1 {
font-size: 30px;
}

.price {
font-size: 25px;
}

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="logo">
COMFORT GRILLS & BITES
</div>

<a
href="cart.html"
class="cart-button"
>
🛒 View Cart
</a>

</header>



<!-- CONTENT -->

<div class="container">


<a
href="index.html"
class="back-link"
>
← Back to Menu
</a>



<div
class="product"
id="product"
>

<!-- PRODUCT WILL LOAD HERE -->

</div>


</div>



<!-- FOOTER -->

<footer>

<p>
<strong>Comfort Grills & Bites</strong>
</p>

<p>
Good Food. Great Taste.
</p>

<p>
© 2026 Comfort Grills & Bites
</p>

</footer>



<script>


/* FOOD DATABASE */

const foods = {


"grilled-chicken": {

name: "Grilled Chicken",

price: 8000,

image:
"https://images.unsplash.com/photo-1598103442097-8b74394b95c6?auto=format&fit=crop&w=1000&q=80",

description:
"Juicy, well-seasoned grilled chicken prepared with our special blend of spices and grilled to perfection.",

features: [

"Freshly prepared",

"Well-seasoned",

"Grilled to perfection",

"Perfect for a satisfying meal"

]

},


"beef-burger": {

name: "Beef Burger",

price: 6500,

image:
"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=80",

description:
"A delicious beef burger served with fresh toppings and our special sauce for a rich and satisfying bite.",

features: [

"Juicy beef patty",

"Fresh toppings",

"Special sauce",

"Freshly prepared"

]

},


"chicken-chips": {

name: "Chicken & Chips",

price: 7500,

image:
"https://images.unsplash.com/photo-1562967916-eb82221dfb92?auto=format&fit=crop&w=1000&q=80",

description:
"Crispy chicken served with golden fries and a delicious dipping sauce. A simple and satisfying favourite.",

features: [

"Crispy chicken",

"Golden fries",

"Delicious dipping sauce",

"Freshly prepared"

]

},


"jollof-rice": {

name: "Jollof Rice & Chicken",

price: 6000,

image:
"https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=1000&q=80",

description:
"Rich Nigerian-style jollof rice served with deliciously seasoned chicken for a classic and satisfying meal.",

features: [

"Nigerian-style jollof rice",

"Seasoned chicken",

"Rich flavour",

"Freshly prepared"

]

},


"grilled-sausage": {

name: "Grilled Sausage",

price: 4000,

image:
"https://images.unsplash.com/photo-1612392062631-94dd858cba88?auto=format&fit=crop&w=1000&q=80",

description:
"Deliciously grilled sausage prepared fresh and served hot. Perfect as a snack or side.",

features: [

"Fresh sausage",

"Grilled fresh",

"Served hot",

"Great as a snack or side"

]

},


"chapman": {

name: "Chapman",

price: 2500,

image:
"https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=1000&q=80",

description:
"A refreshing Nigerian-style cocktail made with fruity flavours and served chilled.",

features: [

"Refreshing",

"Fruity flavour",

"Served chilled",

"Perfect with meals"

]

}

};



/* GET FOOD FROM URL */

const params =
new URLSearchParams(
window.location.search
);

const item =
params.get("item");


/* PRODUCT CONTAINER */

const product =
document.getElementById("product");


/* CHECK ITEM */

if (!item || !foods[item]) {

product.innerHTML = `

<div class="product-info">

<h1>
Food Not Found
</h1>

<p>
Sorry, the food item you are
looking for could not be found.
</p>

<a
href="index.html"
class="order-button"
>
Back to Menu
</a>

</div>

`;

} else {


const food =
foods[item];


product.innerHTML = `

<img
class="product-image"
src="${food.image}"
alt="${food.name}"
>


<div class="product-info">

<h1>
${food.name}
</h1>


<div class="price">
₦${food.price.toLocaleString()}
</div>


<p class="description">
${food.description}
</p>


<div class="features">

<h3>
What you get
</h3>

<ul>

${food.features.map(
feature =>
`<li>${feature}</li>`
).join("")}

</ul>

</div>


<div class="buttons">


<button
class="add-button"
onclick="addToCart()"
>
Add to Cart
</button>


<a
href="cart.html"
class="order-button"
>
Order Now
</a>


<a
href="cart.html"
class="cart-button-large"
>
View Cart
</a>


</div>


<div
class="message"
id="message"
>
Added to your cart!
</div>


</div>

`;


/* ADD TO CART */

window.addToCart =
function() {


let cart =
JSON.parse(
localStorage.getItem("comfortCart")
) || [];


let existingItem =
cart.find(
cartItem =>
cartItem.name === food.name
);


if (existingItem) {

existingItem.quantity += 1;

} else {

cart.push({

name: food.name,

price: food.price,

quantity: 1

});

}


localStorage.setItem(
"comfortCart",
JSON.stringify(cart)
);


document
.getElementById("message")
.style.display = "block";


setTimeout(
function() {

document
.getElementById("message")
.style.display = "none";

},
2500
);

};

}


</script>


</body>

</html>
