const params = new URLSearchParams(window.location.search);

const itemKey = params.get("item");

const mode = params.get("mode") || "menu";

const food = foods[itemKey];

const container =
document.getElementById("detailsContainer");


function getCart() {

const savedCart =
localStorage.getItem("comfortCart");

if (!savedCart) {
return [];
}

try {
return JSON.parse(savedCart);
}

catch (error) {
return [];
}
}


function saveCart(cart) {

localStorage.setItem(
"comfortCart",
JSON.stringify(cart)
);

}


function addToCart() {

const cart = getCart();

const existing =
cart.find(item => item.name === food.name);


if (existing) {

existing.quantity =
Number(existing.quantity) + 1;

}

else {

cart.push({
name: food.name,
price: food.price,
quantity: 1
});

}


saveCart(cart);

alert(food.name + " added to cart.");

}


if (!food) {

container.innerHTML = `

<div class="not-found">

<h1>Food Not Found</h1>

<p>
Sorry, the food item you are looking for
could not be found.
</p>

<a
class="action-link back-btn"
href="menu.html"
>
Back to Menu
</a>

</div>

`;

}

else {

const backPage =
mode === "order"
? "order.html"
: "menu.html";


let actionButtons = "";


if (mode === "order") {

actionButtons = `

<button
class="add-btn"
type="button"
id="addToCart"
>
Add to Cart
</button>

<a
class="action-link cart-btn"
href="cart.html"
>
View Cart
</a>

`;

}


container.innerHTML = `

<div class="details-card">

<img
class="food-image"
src="${food.image}"
alt="${food.name}"
>

<div class="content">

<div class="category">
${food.category}
</div>

<h1>
${food.name}
</h1>

<div class="price">
₦${food.price.toLocaleString()}
</div>

<div class="description">
${food.description}
</div>

<ul class="features">

${food.features.map(feature => `
<li>${feature}</li>
`).join("")}

</ul>

<div class="actions">

${actionButtons}

<a
class="action-link back-btn"
href="${backPage}"
>
Back
</a>

</div>

</div>

</div>

`;


if (mode === "order") {
