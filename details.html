<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Details | Comfort Grills & Bites</title>

<style>

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: Arial, sans-serif;
background: #f8f8f8;
color: #222;
}

header {
background: #111;
color: white;
padding: 18px 20px;
display: flex;
justify-content: space-between;
align-items: center;
}

header h1 {
font-size: 23px;
}

.cart-button {
background: #1f8f4d;
color: white;
text-decoration: none;
padding: 11px 17px;
border-radius: 6px;
font-weight: bold;
}

.back {
max-width: 1100px;
margin: 25px auto 0;
padding: 0 20px;
}

.back a {
color: #222;
text-decoration: none;
font-weight: bold;
}

.product {
max-width: 1100px;
margin: 25px auto 60px;
padding: 0 20px;

display: grid;
grid-template-columns: 1fr 1fr;
gap: 45px;
align-items: center;
}

.product-image img {
width: 100%;
height: 500px;
object-fit: cover;
border-radius: 14px;
}

.product-info h2 {
font-size: 38px;
margin-bottom: 12px;
}

.price {
color: #1f8f4d;
font-size: 28px;
font-weight: bold;
margin-bottom: 20px;
}

.description {
color: #555;
line-height: 1.7;
font-size: 16px;
margin-bottom: 25px;
}

.features {
margin-bottom: 30px;
}

.features h3 {
margin-bottom: 12px;
}

.features ul {
padding-left: 20px;
color: #555;
line-height: 1.8;
}

.order-actions {
display: none;
gap: 10px;
flex-wrap: wrap;
}

.order-actions button,
.order-actions a {
border: none;
text-decoration: none;
padding: 14px 18px;
border-radius: 6px;
font-size: 15px;
font-weight: bold;
cursor: pointer;
text-align: center;
}

.add-button {
background: #1f8f4d;
color: white;
}

.order-button {
background: #111;
color: white;
}

.cart-link {
background: #e8e8e8;
color: #222;
}

.message {
display: none;
margin-top: 15px;
color: #1f8f4d;
font-weight: bold;
}

.restaurant-note {
display: none;
background: white;
padding: 18px;
border-radius: 8px;
margin-top: 20px;
color: #555;
line-height: 1.6;
}

footer {
background: #111;
color: #aaa;
text-align: center;
padding: 20px;
font-size: 14px;
}

@media (max-width: 750px) {

header h1 {
font-size: 18px;
}

.cart-button {
padding: 9px 12px;
font-size: 14px;
}

.product {
grid-template-columns: 1fr;
gap: 25px;
}

.product-image img {
height: 330px;
}

.product-info h2 {
font-size: 30px;
}

.order-actions {
flex-direction: column;
}

.order-actions button,
.order-actions a {
width: 100%;
}

}

</style>
</head>

<body>

<header>

<h1>COMFORT GRILLS & BITES</h1>

<a href="cart.html" class="cart-button" id="headerCart">
View Cart
</a>

</header>


<div class="back" id="backArea">

<a href="index.html" id="backLink">
← Back
</a>

</div>


<section class="product">

<div class="product-image">

<img id="foodImage" src="" alt="">

</div>


<div class="product-info">

<h2 id="foodName"></h2>

<div class="price" id="foodPrice"></div>

<p class="description" id="foodDescription"></p>


<div class="features">

<h3>About this meal</h3>

<ul id="foodFeatures"></ul>

</div>


<div class="order-actions" id="orderActions">

<button
class="add-button"
id="addButton">
Add to Cart
</button>

<a
href="cart.html"
class="cart-link">
View Cart
</a>

</div>


<div class="message" id="message">

Added to your cart!

</div>


<div class="restaurant-note" id="restaurantNote">

You are viewing this meal from the restaurant menu.
Prices shown are for the current menu.

</div>

</div>

</section>


<footer>

<p>© 2026 Comfort Grills & Bites. All rights reserved.</p>

</footer>


<script>

const foods = {

"grilled-chicken": {

name: "Grilled Chicken",

price: 8000,

image: "https://images.unsplash.com/photo-1598514982901-ae627e5d4a8d?auto=format&fit=crop&w=1200&q=80",

description:
"Juicy grilled chicken prepared with our special seasoning and grilled to perfection.",

features: [
"Freshly prepared",
"Special house seasoning",
"Grilled to perfection"
]

},


"beef-burger": {

name: "Beef Burger",

price: 6500,

image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1200&q=80",

description:
"A delicious beef burger served with fresh vegetables and our special sauce.",

features: [
"Juicy beef patty",
"Fresh vegetables",
"Special house sauce"
]

},


"chicken-chips": {

name: "Chicken & Chips",

price: 7500,

image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=1200&q=80",

description:
"Crispy chicken served with golden chips for a satisfying meal.",

features: [
"Crispy chicken",
"Golden chips",
"Freshly prepared"
]

},


"jollof-rice": {

name: "Jollof Rice & Chicken",

price: 6000,

image: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=1200&q=80",

description:
"Flavourful Nigerian jollof rice served with perfectly seasoned chicken.",

features: [
"Nigerian-style jollof rice",
"Seasoned chicken",
"Freshly prepared"
]

},


"grilled-sausage": {

name: "Grilled Sausage",

price: 4000,

image: "https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=1200&q=80",

description:
"Well-seasoned grilled sausage prepared fresh and served hot.",

features: [
"Fresh sausage",
"Well seasoned",
"Grilled and served hot"
]

},


"chapman": {

name: "Chapman",

price: 2500,

image: "https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=1200&q=80",

description:
"A refreshing Nigerian-style cocktail made with a blend of fruity flavours.",

features: [
"Refreshing drink",
"Fruity flavour",
"Served chilled"
]

}

};


const params =
new URLSearchParams(window.location.search);


const item =
params.get("item");


const mode =
params.get("mode");


const food =
foods[item];


if (food) {

document.getElementById("foodName").textContent =
food.name;

document.getElementById("foodPrice").textContent =
"₦" + food.price.toLocaleString();

document.getElementById("foodDescription").textContent =
food.description;

document.getElementById("foodImage").src =
food.image;

document.getElementById("foodImage").alt =
food.name;


const featureList =
document.getElementById("foodFeatures");


food.features.forEach(function(feature) {

const li =
document.createElement("li");

li.textContent =
feature;

featureList.appendChild(li);

});


document.title =
food.name + " | Comfort Grills & Bites";


const addButton =
document.getElementById("addButton");


addButton.onclick =
function() {

addToCart(
food.name,
food.price
);

};


if (mode === "menu") {

document.getElementById("orderActions").style.display =
"none";

document.getElementById("headerCart").style.display =
"none";

document.getElementById("restaurantNote").style.display =
"block";

document.getElementById("backLink").href =
"menu.html";

document.getElementById("backLink").textContent =
"← Back to Menu";

} else {

document.getElementById("orderActions").style.display =
"flex";

document.getElementById("headerCart").style.display =
"block";

document.getElementById("restaurantNote").style.display =
"none";

document.getElementById("backLink").href =
"order.html";

document.getElementById("backLink").textContent =
"← Back to Order";

}

}


function getCart() {

return JSON.parse(
localStorage.getItem("comfortCart")
) || [];

}


function addToCart(name, price) {

let cart =
getCart();


let existingItem =
cart.find(
item => item.name === name
);


if (existingItem) {

existingItem.quantity += 1;

} else {

cart.push({

name: name,
price: price,
quantity: 1

});

}


localStorage.setItem(
"comfortCart",
JSON.stringify(cart)
);


document.getElementById("message").style.display =
"block";

}

</script>

</body>
</html>
