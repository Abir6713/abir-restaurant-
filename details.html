const params =
new URLSearchParams(window.location.search);


const item =
params.get("item");


const mode =
params.get("mode");


const food =
foods[item];


if (!food) {

document.getElementById("foodName").textContent =
"Item Not Found";

document.getElementById("foodDescription").textContent =
"Sorry, this menu item could not be found.";

} else {


document.getElementById("foodName").textContent =
food.name;


document.getElementById("foodPrice").textContent =
"₦" + food.price.toLocaleString();


document.getElementById("foodImage").src =
food.image;


document.getElementById("foodImage").alt =
food.name;


document.getElementById("foodDescription").textContent =
food.description;


const featureList =
document.getElementById("foodFeatures");


food.features.forEach(function(feature) {

const li =
document.createElement("li");

li.textContent =
feature;

featureList.appendChild(li);

});


document.getElementById("addButton")
.onclick = function() {

addToCart(
food.name,
food.price
);

};

}


/* MENU MODE */

if (mode === "menu") {

document.getElementById("orderActions")
.style.display = "none";

document.getElementById("cartLink")
.style.display = "none";

document.getElementById("backLink")
.href = "menu.html";

document.getElementById("backLink")
.textContent = "← Back to Menu";

}


/* ORDER MODE */

else {

document.getElementById("cartLink")
.style.display = "inline-block";

document.getElementById("backLink")
.href = "order.html";

document.getElementById("backLink")
.textContent = "← Back to Order";

}



function getCart() {

return JSON.parse(
localStorage.getItem("comfortCart")
) || [];

}


function addToCart(name, price) {

let cart = getCart();


let existingItem =
cart.find(function(item) {

return item.name === name;

});


if (existingItem) {

existingItem.quantity += 1;

}

else {

cart.push({

name: name,
price: price,
quantity: 1

});

}


localStorage.setItem(
"comfortCart",
JSON.stringify(cart)
);


alert(
name + " added to cart."
);

}
